<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>페이스콕 — 연결 끊김</title>
    <!--
      서비스워커가 캐시해 두고, 네트워크가 끊긴 채로 화면을 이동할 때만 보여준다.
      globals.css를 불러올 수 없는 상황이므로 색값을 그대로 적는다.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f5f6fa;
        color: #1a1a2e;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 430px;
        padding: 32px 24px;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #6b7280;
      }
      button {
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 16px;
        background: #4f46e5;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: #3730a3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="mark" src="/icon-192.png" alt="" />
      <h1>연결이 끊겼어요</h1>
      <p>
        네트워크를 확인한 뒤 다시 시도해주세요.<br />
        부스 와이파이가 혼잡할 수 있어요.
      </p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
